name: AIAtlasHub vendor link health
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check vendor links
        run: python scripts/check-vendor-links.py
      - name: Publish reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-link-health
          path: artifacts/vendor-link-health.*
          if-no-files-found: warn
          retention-days: 30
